<nav
  class="sticky top-0 z-50 w-full border-b border-gray-200/60 bg-white/80 backdrop-blur-xl"
>
  <div
    class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 lg:px-8"
  >
    <!-- Logo -->
    <div class="flex items-center gap-3">
      <img
        src="assets/logo.png"
        alt="Knowledge Nation"
        class="h-11 w-11 rounded-xl object-cover shadow-md"
      />

      <a
        routerLink="/"
        class="text-xl font-extrabold tracking-tight text-primary"
      >
        Knowledge Nation
      </a>
    </div>

    <!-- Desktop Menu -->
    <div class="hidden items-center gap-2 md:flex">
      <a
        routerLink="/"
        routerLinkActive="bg-primary text-white shadow-md"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-xl px-4 py-2 text-sm font-semibold text-gray-700 transition-all duration-200 hover:bg-primary/10 hover:text-primary"
      >
        Home
      </a>

      <a
        routerLink="/about"
        routerLinkActive="bg-primary text-white shadow-md"
        class="rounded-xl px-4 py-2 text-sm font-semibold text-gray-700 transition-all duration-200 hover:bg-primary/10 hover:text-primary"
      >
        About
      </a>

      <a
        routerLink="/online-support"
        routerLinkActive="bg-primary text-white shadow-md"
        class="rounded-xl px-4 py-2 text-sm font-semibold text-gray-700 transition-all duration-200 hover:bg-primary/10 hover:text-primary"
      >
        Online Support
      </a>

      <!-- Dropdown -->
      <div class="group relative">
        <button
          [routerLink]="'/test-series'"
          class="flex items-center gap-1 rounded-xl px-4 py-2 text-sm font-semibold text-gray-700 transition-all duration-200 hover:bg-primary/10 hover:text-primary"
        >
          Test Series

          <svg
            class="h-4 w-4 transition duration-300 group-hover:rotate-180"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <!-- Dropdown Menu -->
        <div
          class="invisible absolute left-0 top-full mt-3 w-56 translate-y-2 rounded-2xl border border-gray-100 bg-white p-2 opacity-0 shadow-2xl transition-all duration-200 group-hover:visible group-hover:translate-y-0 group-hover:opacity-100 overflow-auto h-auto"
        >
          <a
           *ngFor="let menu of menus()"
            routerLink="/test-series"
            class="block rounded-xl px-4 py-3 text-sm font-medium text-gray-700 transition hover:bg-primary/10 hover:text-primary"
          >
            {{ menu.name }}
          </a>

          <!-- <a
            routerLink="/test-series"
            class="block rounded-xl px-4 py-3 text-sm font-medium text-gray-700 transition hover:bg-primary/10 hover:text-primary"
          >
            SSC
          </a>
          <a
            routerLink="/test-series"
            class="block rounded-xl px-4 py-3 text-sm font-medium text-gray-700 transition hover:bg-primary/10 hover:text-primary"
          >
            BPSC TRE
          </a> -->
        </div>
      </div>
    </div>

    <!-- Right Actions -->

    <div class="flex items-center gap-3">

      @if (user$ | async; as user) {
        <!-- USER ICON -->
        <div class="relative">
          <button
            (click)="toggleAuthMenu($event)"
            class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center hover:bg-gray-300 transition"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5 text-gray-800"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 12a4 4 0 100-8 4 4 0 000 8z"
              />

              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 20a8 8 0 0116 0"
              />
            </svg>
          </button>

          <!-- DROPDOWN -->
          @if (isAuthMenuOpen()) {
            <div
              class="absolute right-0 mt-3 w-48 bg-white rounded-md shadow-lg z-50 overflow-hidden animate-fade-in"
            >
              <a routerLink="/dashboard" (click)="closeMenu()" class="block px-4 py-2 text-sm hover:bg-gray-100">
                Dashboard
              </a>



              <div class="border-t"></div>

              <button
                (click)="logout()"
                class="w-full text-left px-4 py-2 text-sm text-red-500 hover:bg-gray-100"
              >
                Logout
              </button>
            </div>
          }
        </div>

      }

       @if (!auth.isLoggedIn()) {
      <!-- Login Button -->
        <a
          routerLink="/login"
          class="hidden rounded-xl bg-primary px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-all duration-200 hover:-translate-y-0.5 hover:shadow-xl md:block"
        >
          Login
        </a>
      }
      <!-- Mobile Toggle -->
      <button
        (click)="open = !open"
        class="flex h-11 w-11 items-center justify-center rounded-xl border border-gray-200 bg-white text-gray-700 shadow-sm transition hover:bg-gray-50 md:hidden"
      >
        <svg
          *ngIf="!open"
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>

        <svg
          *ngIf="open"
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div
    *ngIf="open"
    class="border-t border-gray-100 bg-white px-4 pb-5 pt-3 shadow-xl md:hidden"
  >
    <div class="space-y-2">
      <a
        routerLink="/"
        (click)="closeMenu()"
        routerLinkActive="bg-primary text-white"
        [routerLinkActiveOptions]="{ exact: true }"
        class="block rounded-xl px-4 py-3 font-semibold text-gray-700 transition hover:bg-primary/10"
      >
        Home
      </a>

      <a
        routerLink="/about"
        (click)="closeMenu()"
        routerLinkActive="bg-primary text-white"
        class="block rounded-xl px-4 py-3 font-semibold text-gray-700 transition hover:bg-primary/10"
      >
        About
      </a>

      <a
        routerLink="/online-support"
        (click)="closeMenu()"
        routerLinkActive="bg-primary text-white"
        class="block rounded-xl px-4 py-3 font-semibold text-gray-700 transition hover:bg-primary/10"
      >
        Online Support
      </a>

      <!-- Mobile Dropdown -->
      <div class="overflow-hidden rounded-2xl border border-gray-100">
        <button
          (click)="testSeriesOpen = !testSeriesOpen"
          class="flex w-full items-center justify-between px-4 py-3 font-semibold text-gray-700"
        >
          Test Series

          <svg
            class="h-4 w-4 transition-transform duration-300"
            [class.rotate-180]="testSeriesOpen"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <div *ngIf="testSeriesOpen" class="space-y-1 px-2 pb-2 overflow-scroll h-226">
          <a
            *ngFor="let menu of menus()"
            routerLink="/test-series"
            (click)="closeMenu()"
            class="block rounded-xl px-4 py-2 text-sm text-gray-600 hover:bg-primary/10 hover:text-primary"
          >
            {{ menu.name }}
          </a>

          <!-- <a
            routerLink="/test-series/free"
            (click)="closeMenu()"
            class="block rounded-xl px-4 py-2 text-sm text-gray-600 hover:bg-primary/10 hover:text-primary"
          >
            BPSC Mains
          </a> -->
        </div>
      </div>

      <!-- Mobile Login -->
        @if (!auth.isLoggedIn()) {
          <a
            routerLink="/login"
            (click)="closeMenu()"
            class="mt-3 block rounded-xl bg-primary px-4 py-3 text-center font-bold text-white shadow-md"
          >
            Login
          </a>
        }
    </div>
  </div>
</nav>
