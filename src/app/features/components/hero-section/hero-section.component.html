  <section
    class="relative h-[400px] overflow-hidden md:h-[650px]"
    (mouseenter)="pauseSlider()"
    (mouseleave)="startAutoSlide()"
  >
    <!-- SLIDES -->
    <div
      class="flex h-full transition-transform duration-700 ease-in-out"
      [style.width.%]="slides.length * 100"
      [style.transform]="'translateX(-' + currentSlide * (100 / slides.length) + '%)'"
    >
      <div
        *ngFor="let slide of slides"
        class="relative h-full shrink-0"
        [style.width.%]="100 / slides.length"
      >
        <img
          [src]="slide.image"
          [alt]="slide.title"
          class="h-full w-full object-cover"
        />

        <div
          class="absolute inset-0 bg-[linear-gradient(120deg,rgba(63,4,62,0.82)_0%,rgba(137,1,23,0.55)_55%,rgba(0,0,0,0.15)_100%)]"
        ></div>

        <div
          class="absolute left-4 top-1/2 max-w-2xl -translate-y-1/2 text-white md:left-20"
        >
          <span
            class="mb-3 inline-block rounded-full bg-[#c8860a] px-2.5 py-0.5 text-[10px] font-semibold uppercase tracking-widest text-[#3f043e] md:mb-5 md:px-4 md:py-1 md:text-xs"
          >
            {{ slide.tag }}
          </span>

          <h1
            class="mb-3 font-['Playfair_Display'] text-2xl font-extrabold leading-tight md:mb-5 md:text-6xl"
          >
            {{ slide.title }}
          </h1>

          <p
            class="mb-5 max-w-xl text-sm leading-6 text-white/90 md:mb-8 md:text-lg md:leading-8"
          >
            {{ slide.description }}
          </p>

          <div class="flex flex-wrap gap-3">
            <a
              routerLink="/test-series"
              class="rounded-lg bg-[#890117] px-4 py-2 text-xs font-semibold text-white transition hover:-translate-y-0.5 hover:bg-[#a8001f] md:px-7 md:py-3 md:text-base"
            >
              {{ slide.primaryBtn }}
            </a>

            <a
              routerLink="/study-material"
              class="rounded-lg border-2 border-white/70 px-4 py-2 text-xs font-medium text-white transition hover:bg-white/10 md:px-7 md:py-3 md:text-base"
            >
              {{ slide.secondaryBtn }}
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- CONTROLS -->
    <button
      (click)="prevSlide()"
      class="absolute left-2 top-1/2 z-20 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-full border border-white/30 bg-white/10 text-sm text-white backdrop-blur-md transition hover:scale-105 hover:bg-white/20 md:left-5 md:h-12 md:w-12 md:text-2xl"
    >
      ←
    </button>

    <button
      (click)="nextSlide()"
      class="absolute right-2 top-1/2 z-20 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-full border border-white/30 bg-white/10 text-sm text-white backdrop-blur-md transition hover:scale-105 hover:bg-white/20 md:right-5 md:h-12 md:w-12 md:text-2xl"
    >
      →
    </button>

    <!-- DOTS -->
    <div
      class="absolute bottom-4 left-1/2 z-20 flex -translate-x-1/2 gap-1.5 md:bottom-6 md:gap-2"
    >
      <button
        *ngFor="let slide of slides; let i = index"
        (click)="goToSlide(i)"
        class="h-1.5 rounded-full transition-all duration-300 md:h-2.5"
        [ngClass]="
          currentSlide === i
            ? 'w-4 bg-white md:w-7'
            : 'w-1.5 bg-white/40 md:w-2.5'
        "
      ></button>
    </div>
  </section>

  <!-- STATS -->
  <section
    class="flex flex-wrap items-center justify-center gap-5 bg-[#410040] px-4 py-4 md:gap-10 md:px-5 md:py-6"
  >
    <div *ngFor="let stat of stats" class="text-center text-white">
      <span
        class="block font-['Playfair_Display'] text-2xl font-bold text-[#f9b84a] md:text-3xl"
      >
        {{ stat.number }}
      </span>

      <span class="text-xs tracking-wide text-white/75 md:text-sm">
        {{ stat.label }}
      </span>
    </div>
  </section>
