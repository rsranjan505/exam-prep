  <section
    class="relative h-[650px] overflow-hidden"
    (mouseenter)="pauseSlider()"
    (mouseleave)="startAutoSlide()"
  >
    <!-- SLIDES -->
    <div
      class="flex h-full transition-transform duration-700 ease-in-out"
      [style.width.%]="slides.length * 100"
      [style.transform]="'translateX(-' + currentSlide * (100 / slides.length) + '%)'"
    >
      <div
        *ngFor="let slide of slides"
        class="relative h-full shrink-0"
        [style.width.%]="100 / slides.length"
      >
        <img
          [src]="slide.image"
          [alt]="slide.title"
          class="h-full w-full object-cover"
        />

        <div
          class="absolute inset-0 bg-[linear-gradient(120deg,rgba(63,4,62,0.82)_0%,rgba(137,1,23,0.55)_55%,rgba(0,0,0,0.15)_100%)]"
        ></div>

        <div
          class="absolute left-6 top-1/2 max-w-2xl -translate-y-1/2 text-white md:left-20"
        >
          <span
            class="mb-5 inline-block rounded-full bg-[#c8860a] px-4 py-1 text-xs font-semibold uppercase tracking-widest text-[#3f043e]"
          >
            {{ slide.tag }}
          </span>

          <h1
            class="mb-5 font-['Playfair_Display'] text-4xl font-extrabold leading-tight md:text-6xl"
          >
            {{ slide.title }}
          </h1>

          <p
            class="mb-8 max-w-xl text-base leading-8 text-white/90 md:text-lg"
          >
            {{ slide.description }}
          </p>

          <div class="flex flex-wrap gap-4">
            <a
              routerLink="/test-series"
              class="rounded-lg bg-[#890117] px-7 py-3 font-semibold text-white transition hover:-translate-y-0.5 hover:bg-[#a8001f]"
            >
              {{ slide.primaryBtn }}
            </a>

            <a
              routerLink="/study-material"
              class="rounded-lg border-2 border-white/70 px-7 py-3 font-medium text-white transition hover:bg-white/10"
            >
              {{ slide.secondaryBtn }}
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- CONTROLS -->
    <button
      (click)="prevSlide()"
      class="absolute left-5 top-1/2 z-20 flex h-12 w-12 -translate-y-1/2 items-center justify-center rounded-full border border-white/30 bg-white/10 text-2xl text-white backdrop-blur-md transition hover:scale-105 hover:bg-white/20"
    >
      ←
    </button>

    <button
      (click)="nextSlide()"
      class="absolute right-5 top-1/2 z-20 flex h-12 w-12 -translate-y-1/2 items-center justify-center rounded-full border border-white/30 bg-white/10 text-2xl text-white backdrop-blur-md transition hover:scale-105 hover:bg-white/20"
    >
      →
    </button>

    <!-- DOTS -->
    <div
      class="absolute bottom-6 left-1/2 z-20 flex -translate-x-1/2 gap-2"
    >
      <button
        *ngFor="let slide of slides; let i = index"
        (click)="goToSlide(i)"
        class="h-2.5 rounded-full transition-all duration-300"
        [ngClass]="
          currentSlide === i
            ? 'w-7 bg-white'
            : 'w-2.5 bg-white/40'
        "
      ></button>
    </div>
  </section>

  <!-- STATS -->
  <section
    class="flex flex-wrap items-center justify-center gap-10 bg-[#410040] px-5 py-6"
  >
    <div *ngFor="let stat of stats" class="text-center text-white">
      <span
        class="block font-['Playfair_Display'] text-3xl font-bold text-[#f9b84a]"
      >
        {{ stat.number }}
      </span>

      <span class="text-sm tracking-wide text-white/75">
        {{ stat.label }}
      </span>
    </div>
  </section>
