  <section
  class="relative py-20 overflow-hidden"
  style="
    background: linear-gradient(160deg, #fafafa 0%, #f3f0f8 50%, #faf0f2 100%);
  "
>
  <!-- Background decorative circles -->
  <div
    class="absolute -top-32 -left-32 w-96 h-96 rounded-full pointer-events-none"
    style="
      background: radial-gradient(
        circle,
        rgba(137, 1, 23, 0.06) 0%,
        transparent 70%
      );
    "
  ></div>
  <div
    class="absolute -bottom-24 -right-24 w-80 h-80 rounded-full pointer-events-none"
    style="
      background: radial-gradient(
        circle,
        rgba(64, 6, 117, 0.06) 0%,
        transparent 70%
      );
    "
  ></div>

  <div class="max-w-7xl mx-auto px-6 md:px-12">
    <!-- Section header -->
    <div class="text-center mb-14">
      <!-- Eyebrow label -->
      <div
        class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-widest px-4 py-2 rounded-full mb-4"
        style="
          background: rgba(137, 1, 23, 0.08);
          color: var(--color-primary);
          border: 1px solid rgba(137, 1, 23, 0.15);
        "
      >
        ✦ Why Choose Us
      </div>

      <h2
        class="font-['Playfair_Display'] text-3xl md:text-5xl font-black section-title"
        style="color: var(--color-dark)"
      >
        Everything You Need to
        <em class="not-italic" style="color: var(--color-primary)">Succeed</em>
      </h2>

      <p
        class="mt-5 text-gray-500 text-base md:text-lg max-w-xl mx-auto leading-relaxed"
      >
        Knowledge Nation brings together the best tools, faculty, and resources
        — all in one place.
      </p>
    </div>

    <!-- Feature cards grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (f of features; track trackByTitle($index, f); let i = $index) {

      <div
        class="feature-card fade-in-up bg-white rounded-2xl p-7 border border-gray-100 cursor-default group"
        [class]="'delay-' + (i + 1)"
      >
        <!-- Icon orb -->
        <div
          class="icon-orb w-14 h-14 rounded-2xl flex items-center justify-center text-2xl mb-5 shadow-sm"
          [style.background]="f.color + '15'"
          [style.border]="'1.5px solid ' + f.color + '25'"
        >
          {{ f.icon }}
        </div>

        <!-- Colored top accent line (visible on hover via group) -->
        <div
          class="h-0.5 w-0 group-hover:w-12 rounded-full mb-3 transition-all duration-500 ease-out"
          [style.background]="f.color"
        ></div>

        <h3
          class="font-['Playfair_Display'] text-lg font-bold mb-2"
          style="color: var(--color-dark)"
        >
          {{ f.title }}
        </h3>

        <p class="text-gray-500 text-sm leading-relaxed">
          {{ f.description }}
        </p>

        <!-- Learn more link -->
        <a
          href="#"
          class="inline-flex items-center gap-1.5 mt-5 text-xs font-bold uppercase tracking-wider no-underline transition-all duration-200 hover:gap-3"
          [style.color]="f.color"
        >
          Learn more
          <span
            class="transition-transform duration-200 group-hover:translate-x-1"
            >→</span
          >
        </a>
      </div>

      }
    </div>


  </div>
</section>
