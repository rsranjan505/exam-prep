  <section class="px-5 py-20 md:px-12">
    <div class="mx-auto max-w-7xl text-center">
      <span
        class="mb-4 inline-block rounded-full bg-[#890117]/10 px-4 py-1 text-xs font-semibold uppercase tracking-widest text-[#890117]"
      >
        Why Choose Us
      </span>

      <h2
        class="mb-5 font-['Playfair_Display'] text-4xl font-bold text-[#1a0518]"
      >
        Everything You Need to Clear BPSC
      </h2>

      <div
        class="mx-auto mb-14 h-1 w-16 rounded-full bg-gradient-to-r from-[#890117] to-[#400675]"
      ></div>

      <div
        class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3"
      >
        <div
          *ngFor="let feature of features"
          class="group relative overflow-hidden rounded-2xl border border-[#e8dfe8] bg-white p-8 transition hover:-translate-y-2 hover:shadow-2xl"
        >
          <div
            class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-[#890117] to-[#400675]"
          ></div>

          <div
            class="mb-5 flex h-14 w-14 items-center justify-center rounded-xl text-3xl"
            [ngClass]="feature.bg"
          >
            {{ feature.icon }}
          </div>

          <h3
            class="mb-3 font-['Playfair_Display'] text-2xl font-bold"
          >
            {{ feature.title }}
          </h3>

          <p class="leading-7 text-[#7a5a79]">
            {{ feature.description }}
          </p>
        </div>
      </div>
    </div>
  </section>
